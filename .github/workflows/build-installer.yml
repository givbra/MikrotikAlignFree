# Безплатно изграждане на .exe и инсталатор в GitHub Actions (Windows).
# Runs on push of mikrotikalignfree.py to main, on tags v* or manually (Actions -> Run workflow).
# A GitHub release with the installer is created or updated automatically.
name: build-installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mikrotikalignfree.py", "build/**", ".github/workflows/build-installer.yml"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86
      - name: Инсталиране на PyInstaller
        run: python -m pip install "pyinstaller==5.13.2"
      - name: Изграждане на програмата
        run: pyinstaller --noconfirm --clean --onedir --noconsole --name MikrotikAlignFree --distpath dist --workpath build/work --specpath build/work mikrotikalignfree.py
      - name: Проверка, че програмата стартира
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MikrotikAlignFree\MikrotikAlignFree.exe" -ArgumentList "--no-browser","--port","18099" -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-RestMethod -Uri "http://127.0.0.1:18099/api/declination?lat=41.84&lon=23.09"
          Write-Host ("Declination: " + $r.declination)
          Stop-Process -Id $p.Id -Force
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\mikrotikalignfree.iss
      - name: Преносима версия (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\MikrotikAlignFree -DestinationPath installer\MikrotikAlignFree-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MikrotikAlignFree-Setup
          path: installer/*
      - name: Release (tag or push to main)
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path mikrotikalignfree.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem installer\*).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem installer\*).FullName --title "MikrotikAlignFree $ver" --target $env:GITHUB_SHA --notes "Windows installer (MikrotikAlignFree-Setup-$ver.exe) and a portable zip. English and Bulgarian interface."
          }
